name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: install shells + shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck zsh

      - name: py_compile the engine
        run: python3 -m py_compile skills/recall/scripts/recall.py

      - name: shellcheck POSIX scripts
        run: |
          find skills -name '*.sh' -print0 | xargs -0 -r shellcheck -s sh

      - name: bash -n / zsh -n the shell integrations
        run: |
          bash -n skills/recall/scripts/recall.bash
          zsh -n skills/recall/scripts/recall.zsh

      - name: validate JSON manifests
        run: |
          fail=0
          for f in $(find . -path ./node_modules -prune -o -name '*.json' -print); do
            python3 -c "import json,sys; json.load(open(sys.argv[1]))" "$f" || { echo "invalid JSON: $f"; fail=1; }
          done
          exit $fail

      - name: SKILL.md has name + description frontmatter
        run: |
          f=skills/recall/SKILL.md
          head -25 "$f" | grep -q '^name:' || { echo "SKILL.md missing name:"; exit 1; }
          head -25 "$f" | grep -q '^description:' || { echo "SKILL.md missing description:"; exit 1; }

      - name: every command has description + argument-hint
        run: |
          fail=0
          for f in commands/*.md; do
            head -10 "$f" | grep -q '^description:' || { echo "command missing description: $f"; fail=1; }
            head -10 "$f" | grep -q '^argument-hint:' || { echo "command missing argument-hint: $f"; fail=1; }
          done
          exit $fail

      - name: render engine self-check (round-trips a session)
        run: |
          set -e
          export RECALL_HOME="$(mktemp -d)"
          export RECALL_SESSION_ID="ci-0001"
          python3 skills/recall/scripts/recall.py begin >/dev/null
          sh skills/recall/scripts/recall.sh log 0 12 "$HOME" -- "echo hello"
          sh skills/recall/scripts/recall.sh log 1 34 "$HOME" -- "export TOKEN=sk-shouldberedacted0000000000"
          printf 'building: 10%%\rbuilding: 100%%\ndone\n' > "$RECALL_HOME/raw/ci-0001.log"
          python3 skills/recall/scripts/recall.py finalize ci-0001 >/dev/null
          md="$RECALL_HOME/sessions/ci-0001.md"
          grep -q 'echo hello' "$md" || { echo "command not rendered"; exit 1; }
          grep -q '«redacted»' "$md" || { echo "redaction did not run"; exit 1; }
          grep -q 'sk-shouldberedacted' "$md" && { echo "SECRET LEAKED into render"; exit 1; }
          grep -q 'building: 10%' "$md" && { echo "progress redraw not collapsed"; exit 1; }
          grep -q 'building: 100%' "$md" || { echo "final redraw missing"; exit 1; }
          echo "render self-check passed"

      - name: secret / captured-artifact guard
        run: sh skills/recall/scripts/scan_secrets.sh .
